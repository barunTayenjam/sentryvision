ffmpeg:
  # Detect + relay stream. 1280x720 (was 640x360): detection accuracy is
  # pixel-bound — 640x360 starved YOLO of small/distant persons. 720p is
  # the Frigate-documented sweet spot; bitrate raised to keep compression
  # artifacts below the resolution win.
  # CPU optimization (Oct 12): dropped to 10fps / 1500k from 15fps / 2048k
  # to cut go2rtc transcode load (was 50% of 2-CPU cap). Tiles still smooth.
  h264_low: "-codec:v libx264 -filter:v scale=1280:720,fps=10 -preset:v ultrafast -tune:v zerolatency -g:v 15 -b:v 1500k -pix_fmt:v yuv420p"

streams:
  cam1:
    - ${CAM1_RTSP_URL}
  cam1_low:
    - ffmpeg:rtsp://127.0.0.1:8554/cam1#video=h264_low
  cam2:
    - ${CAM2_RTSP_URL}
  cam2_low:
    - ffmpeg:rtsp://127.0.0.1:8554/cam2#video=h264_low
  # Back-compat aliases: older cached frontends request *_sub.
  # Relay of the low transcode — still zero extra camera connections.
  cam1_sub:
    - rtsp://127.0.0.1:8554/cam1_low
  cam2_sub:
    - rtsp://127.0.0.1:8554/cam2_low

api:
  listen: ":1984"
  origin: "*"

webrtc:
  listen: ":8555"
  candidates:
    - ${GO2RTC_ADVERTISED_HOST}:8555
    - stun:stun.l.google.com:19302
    - stun:stun1.l.google.com:19302

log:
  level: "info"
  format: "text"
