services:
  # PostgreSQL Database
  postgres:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: sentryvision-postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_DB=sentryvision
      - POSTGRES_USER=sentryvision
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=Asia/Kolkata
    command: >
      postgres
      -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-48MB}
      -c max_connections=${POSTGRES_MAX_CONNECTIONS:-15}
      -c work_mem=${POSTGRES_WORK_MEM:-2MB}
      -c maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-16MB}
      -c effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-96MB}
      -c huge_pages=off
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c default_statistics_target=50
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentryvision -d sentryvision"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentryvision_network
    deploy:
      resources:
        limits:
          cpus: ${POSTGRES_CPU_LIMIT:-0.5}
          memory: ${POSTGRES_MEM_LIMIT:-512M}
        reservations:
          cpus: ${POSTGRES_CPU_RESERVE:-0.1}
          memory: ${POSTGRES_MEM_RESERVE:-64M}

  # Backend API Server (production mode, serves frontend static files)
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: sentryvision-app
    ports:
      - "0.0.0.0:9753:9753"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=9753
      - DB_HOST=postgres
      - TZ=Asia/Kolkata
      - DB_PORT=5432
      - DB_NAME=sentryvision
      - DB_USER=sentryvision
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}
      - OPENCV_SERVICE_URL=http://opencv:8084
      - OPENCV_API_TOKEN=${OPENCV_API_TOKEN:-}
      - RELATIONS_SERVICE_URL=http://relations:8085
      - RELATIONS_API_TOKEN=${OPENCV_API_TOKEN:-}
      - DETECTIONS_DIR=/app/data/detections
      # Persist web-push keys under the ./data bind mount — default /data/vapid
      # is not mounted, so keys regenerated on every container restart
      - VAPID_KEYS_DIR=/app/data/vapid
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_API_BASE_URL=${NVIDIA_API_BASE_URL}
      # Analysis model. VISION_FALLBACK_MODELS in server/src/services/nvidia/
      # nvidiaClient.ts spans ag/ and ollama-local/ so a single dead provider
      # prefix cannot take AI analysis down.
      - NVIDIA_MODEL=${NVIDIA_MODEL:-ag/gemini-3.8-flash}
      # Local on-device LLM (Ollama on host). Set OLLAMA_BASE_URL to enable;
      # overrides NVIDIA cloud analysis. Empty = cloud mode.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma3:4b}
      - SCENE_MEMORY_ENABLED=${SCENE_MEMORY_ENABLED:-false}
      - SCENE_MEMORY_LLM_URL=${SCENE_MEMORY_LLM_URL:-http://host.docker.internal:11434}
      - SCENE_MEMORY_MODEL=${SCENE_MEMORY_MODEL:-gemma3:4b}
      - SCENE_MEMORY_LOAD_THRESHOLD=${SCENE_MEMORY_LOAD_THRESHOLD:-6}
      - SCENE_MEMORY_TIMEOUT_MS=${SCENE_MEMORY_TIMEOUT_MS:-240000}
      - PERSON_MIN_CONFIDENCE=${PERSON_MIN_CONFIDENCE:-0.55}
      - PERSON_MIN_TRACK_HITS=${PERSON_MIN_TRACK_HITS:-3}
      - LOW_RESOURCE_MODE=${LOW_RESOURCE_MODE:-true}
      - FFMPEG_THREADS=${FFMPEG_THREADS:-2}
      - DEFAULT_FPS=${DEFAULT_FPS:-2}
      - DEFAULT_RESOLUTION=${DEFAULT_RESOLUTION:-640x360}
      - STREAM_INACTIVITY_TIMEOUT=${STREAM_INACTIVITY_TIMEOUT:-300000}
      - PIPELINE_MODE=${PIPELINE_MODE:-python-only}
      - PYTHON_WS_URL=ws://opencv:9090
      - REDIS_DISABLED=true
      - FRONTEND_DIST_PATH=/app/frontend-next/out
      - CORS_ORIGIN=${CORS_ORIGIN:-https://argus.tayenjam.qzz.io}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
      - SEED_USER_PASSWORD=${SEED_USER_PASSWORD}
    volumes:
      - ./server/cameras.json:/app/cameras.json
      # Boot-time migration runner reads these (see applyMigrations.ts)
      - ./database/migrations:/app/database/migrations:ro
      # Dev hot-mount: builds locally (npm run build), then
      # `docker restart sentryvision-app` picks up new dist — no rebuild
      - ./server/dist:/app/dist
      - ./frontend-next:/app/frontend-next
      - ./data:/app/data
      - ./public/events:/app/public/events
      - ./public/timelapse:/app/public/timelapse
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: journald
    depends_on:
      postgres:
        condition: service_healthy
      opencv:
        condition: service_started
    restart: always
    networks:
      - sentryvision_network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9753/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: ${BACKEND_CPU_LIMIT:-1.0}
          memory: ${BACKEND_MEM_LIMIT:-512M}
        reservations:
          cpus: ${BACKEND_CPU_RESERVE:-0.25}
          memory: ${BACKEND_MEM_RESERVE:-128M}

  # OpenCV Python Detection Service
  opencv:
    build:
      context: ./opencv-service
      dockerfile: Dockerfile
    container_name: sentryvision-opencv
    ports:
      - "127.0.0.1:8084:8084"
      - "127.0.0.1:9090:9090"
    environment:
      - PORT=8084
      - FLASK_ENV=production
      - TZ=Asia/Kolkata
      - FLASK_DEBUG=0
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=sentryvision
      - POSTGRES_USER=sentryvision
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DETECTIONS_DIR=/app/data/detections
      - OPENCV_API_TOKEN=${OPENCV_API_TOKEN:-}
      - PERSON_MIN_TRACK_HITS=${PERSON_MIN_TRACK_HITS:-3}
      - PERSON_MIN_CONFIDENCE=${PERSON_MIN_CONFIDENCE:-0.55}
      - HUMAN_VERIFIER_SCORE=${HUMAN_VERIFIER_SCORE:-0.35}
      - HUMAN_VERIFIER_NIGHT_SCORE=${HUMAN_VERIFIER_NIGHT_SCORE:-0.35}
      # Dual QAT chain: v8s (persons) + coco_qat (vehicles/animals).
      # Benchmarked vs AI truth on 3115 events (compare_models_ai_truth.py):
      #   COCO fp32   recall 0.780 / F1 0.787 / 55ms
      #   v8n  QAT    recall 0.864 / F1 0.813 / 37ms (ORT)
      #   coco_qat    recall 0.868 / F1 0.822 / 39ms (ORT) + all classes
      #   v8s  QAT    recall 0.884 / F1 0.828 / 112ms (ORT)
      # QAT_ORT=1 executes QDQ graphs INT8-native via onnxruntime (already
      # installed for ArcFace) instead of cv2.dnn's fp32 dequantize (2.3x).
      - YOLO_MODEL=${YOLO_MODEL:-crowdhuman_v8s_qat_640x384}
      - YOLO_QAT_PERSON_THRESH=${YOLO_QAT_PERSON_THRESH:-0.48}
      - YOLO_QAT_MIN_BOX_SIDE=${YOLO_QAT_MIN_BOX_SIDE:-20}
      - YOLO_QAT_MIN_BOX_AREA=${YOLO_QAT_MIN_BOX_AREA:-600}
      - QAT_ORT=${QAT_ORT:-1}
      - QAT_AUX=${QAT_AUX:-coco_qat}
      - OMP_NUM_THREADS=2
      - OPENCV_NUM_THREADS=2
      # Resource discipline (added for the load fix): ORT sessions are
      # intra-op capped at 2 threads in code (OrtRunner + MiniLM embedder) so
      # inference cannot fan out across all 12 host cores; YOLO re-run gap
      # raised to 2s so motion storms (e.g. parked truck) skip duplicate
      # inference instead of burning a full pass per detection frame.
      - YOLO_MIN_INTERVAL_MS=${YOLO_MIN_INTERVAL_MS:-2000}
    devices:
      - /dev/dri:/dev/dri
    volumes:
      # Single source of truth: mount the whole opencv-service tree so every
      # committed file is live in the container — no file-by-file list to
      # drift out of sync. `docker restart sentryvision-opencv` picks up all
      # code changes. Image rebuild only needed for requirements.txt changes.
      - ./opencv-service:/app
      - ./opencv-service/.insightface:/root/.insightface
      - ./opencv-service/.hf-cache:/root/.cache/huggingface
      - ./data/detections:/app/data/detections
      - ./data/events:/app/data/events
      - ./data/snapshots:/app/data/snapshots
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - sentryvision_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: ${OPENCV_CPU_LIMIT:-3.0}
          memory: ${OPENCV_MEM_LIMIT:-2g}
        reservations:
          cpus: ${OPENCV_CPU_RESERVE:-0.5}
          memory: ${OPENCV_MEM_RESERVE:-256M}

  # relations — RelateAnything scene-relation sidecar (numpy 2 stack, isolated
  # from opencv because relsgg cannot share numpy 1.x with insightface)
  relations:
    build:
      context: ./relations-service
      dockerfile: Dockerfile
    container_name: sentryvision-relations
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      - PORT=8085
      - FLASK_ENV=production
      - TZ=Asia/Kolkata
      - DETECTIONS_DIR=/app/data/detections
      - RELATIONS_API_TOKEN=${OPENCV_API_TOKEN:-}
    volumes:
      - ./relations-service:/app
      - ./data/detections:/app/data/detections
    restart: always
    networks:
      - sentryvision_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8085/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: ${RELATIONS_CPU_LIMIT:-2.0}
          memory: ${RELATIONS_MEM_LIMIT:-2g}
        reservations:
          cpus: ${RELATIONS_CPU_RESERVE:-0.25}
          memory: ${RELATIONS_MEM_RESERVE:-256M}

  # go2rtc — RTSP to WebRTC bridge
  go2rtc:
    image: alexxit/go2rtc:1.9.14
    container_name: sentryvision-go2rtc
    ports:
      - "127.0.0.1:1984:1984"
      - "0.0.0.0:8555:8555/tcp"
      - "0.0.0.0:8555:8555/udp"
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml
      - ./go2rtc-entrypoint.sh:/entrypoint.sh
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      - TZ=Asia/Kolkata
      - GO2RTC_ADVERTISED_HOST=${GO2RTC_ADVERTISED_HOST:-localhost}
      - CAM1_RTSP_URL=${CAM1_RTSP_URL:-}
      - CAM2_RTSP_URL=${CAM2_RTSP_URL:-}
    logging:
      driver: journald
    restart: always
    networks:
      - sentryvision_network
    deploy:
      resources:
        limits:
          cpus: ${GO2RTC_CPU_LIMIT:-2.0}
          memory: ${GO2RTC_MEM_LIMIT:-512M}

networks:
  sentryvision_network:
    driver: bridge

volumes:
  postgres_data:
